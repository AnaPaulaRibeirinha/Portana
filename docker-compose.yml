services:
  postgres:
    image: postgres:16-alpine
    container_name: portana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portana
      POSTGRES_USER: portana
      POSTGRES_PASSWORD: portana
    ports:
      - "5432:5432"
    volumes:
      - portana-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portana -d portana"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portana-postgres-data:
